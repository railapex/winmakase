# Winmakase keymap — omarchy grammar, verbatim, as tiler-agnostic data.
#
# Source of truth for every keybinding omarchy ships, mapped to what Winmakase
# does with it on Windows. Each entry either `map`s to GlazeWM command(s) or
# carries a `status` + `note` explaining why not:
#   gap     — feature Winmakase intends to cover but can't yet (planned verb named in note)
#   native  — Windows / an installed tool already covers it (note says what)
#   app     — application-launch layer owns it (apps.conf / webapp render, M2)
#   omitted — deliberately not carried; note says why
# `deviation` marks the few places Winmakase knowingly diverges from omarchy —
# each one is also recorded in DESIGN.md (keymap paragraph).
# `foreach` expands numeric families: {n} = the number, {digit} = n mod 10.
# `chords` (list) compresses a family of chords sharing one fate — allowed only
# on non-mapped entries; mapped entries always bind exactly one chord.
#
# Upstream tracking: re-fetch the files below and diff against this file's
# entries. New/changed upstream binds must land here as new entries or edits —
# grammar drift shows up as a diff, never a surprise.

[meta]
upstream = "basecamp/omarchy"
ref = "quattro"
files = [
  "default/hypr/bindings/tiling.lua",
  "default/hypr/bindings/applications.lua",
  "default/hypr/bindings/clipboard.lua",
  "default/hypr/bindings/utilities.lua",
  "default/hypr/bindings/media.lua",
  "default/hypr/bindings/voxtype.lua",
]
fetched = "2026-08-29"

# Launch commands substituted into `map` entries as {terminal} etc.
# apps.conf (M2) will own user overrides; these are the stock defaults.
[apps]
terminal = "wt"
browser = "chrome"
files = "explorer"
editor = "code"

# ============================================================ tiling.lua

[[bind]]
id = "window-close"
chord = "SUPER + W"
desc = "Close window"
src = "tiling"
map = ["close"]

[[bind]]
id = "window-close-alt"
chord = "SUPER + Q"
