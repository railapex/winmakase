[[bind]]
id = "lock"
chord = "SUPER + CTRL + L"
desc = "Lock system"
src = "utilities"
status = "native"
note = "Win+L is winlogon-level and fires regardless of extra modifiers."

# ============================================================ media.lua

[[bind]]
id = "media-volume"
chords = ["XF86AudioRaiseVolume", "XF86AudioLowerVolume", "XF86AudioMute", "XF86AudioMicMute", "ALT + XF86AudioRaiseVolume", "ALT + XF86AudioLowerVolume"]
desc = "Volume / mute / mic mute"
src = "media"
status = "native"
note = "Hardware keys handled by Windows."

[[bind]]
id = "media-brightness"
chords = ["XF86MonBrightnessUp", "XF86MonBrightnessDown", "SHIFT + XF86MonBrightnessUp", "SHIFT + XF86MonBrightnessDown", "ALT + XF86MonBrightnessUp", "ALT + XF86MonBrightnessDown", "XF86KbdBrightnessUp", "XF86KbdBrightnessDown", "XF86KbdLightOnOff"]
desc = "Display / keyboard brightness"
src = "media"
status = "native"
note = "Hardware keys handled by Windows / OEM drivers."

[[bind]]
id = "media-transport"
chords = ["XF86AudioNext", "ALT + XF86AudioPlay", "XF86AudioPause", "XF86AudioPlay", "XF86AudioPrev", "ALT + SHIFT + XF86AudioPlay", "XF86Eject"]
desc = "Media transport"
src = "media"
status = "native"
note = "Hardware keys handled by Windows."

[[bind]]
id = "touchpad"
chords = ["XF86TouchpadToggle", "XF86TouchpadOn", "XF86TouchpadOff"]
desc = "Touchpad toggles"
src = "media"
status = "native"
note = "Hardware keys; desktop rig has none."

[[bind]]
id = "audio-output-switch"
chord = "SHIFT + XF86AudioMute"
desc = "Switch audio output"
src = "media"
status = "gap"
note = "winmakase-helper audio output switch is a v1 helper feature; chord assignment decided when the helper ships."

[[bind]]
id = "media-source-switch"
chords = ["SHIFT + XF86AudioPause", "SHIFT + XF86AudioPlay"]
desc = "Switch media source"
src = "media"
status = "omitted"
note = "No analog."

# ============================================================ voxtype.lua

[[bind]]
id = "dictation"
chords = ["SUPER + CTRL + X", "F9"]
desc = "Dictation (toggle / push-to-talk)"
src = "voxtype"
status = "native"
note = "Win+H voice typing — stay-stock cut list."
