<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Custom styles. -->
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <!-- Allows React to be run buildless via "text/babel" script below.
         CDN dependencies (babel/react/zebar) are inherited from the starter
         fork; vendoring them is an M2 refinement (repo TODO). -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, {
        useState,
        useEffect,
      } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      // Only the PRIMARY monitor's bar carries the systray (mirroring where
      // Windows keeps its tray). Two live findings force the shape
      // (2026-08-28): the systray provider active in every bar instance made
      // one monitor's dockToEdge registration fail, and splitting into two
      // widget configs made the second config's windows lose their dock
      // entirely (registrations race across concurrently-created configs).
      // One widget on all monitors docks 3/3; the tray gates on
      // primary-at-virtual-origin — a heuristic (true on any single-primary
      // setup where the primary anchors 0,0, which Windows defaults to);
      // the M2 config render replaces it with real monitor knowledge.
      const withTray = window.screenX === 0;

      const providers = zebar.createProviderGroup({
        network: { type: 'network' },
        glazewm: { type: 'glazewm' },
        ...(withTray ? { systray: { type: 'systray' } } : {}),
        cpu: { type: 'cpu' },
        date: { type: 'date', formatting: 'EEE d MMM t' },
        memory: { type: 'memory' },
        weather: { type: 'weather' },
      });

      // The supervisor's health dot polls `winmakase status --json` (declared
      // under privileges.shellCommands). States: ok (all running), warn
      // (something restarting), down (stack stopped or supervisor dead),
      // unknown (no winmakase, no health state yet).
      const HEALTH_POLL_MS = 5000;

      async function readHealth() {
        try {
          const result = await zebar.shellExec(
            'C:/Users/chris/.winmakase/bin/winmakase.exe',
            ['status', '--json'],
          );
          const health = JSON.parse(result.stdout);
          if (
            health.supervisorProcessAlive === false ||
            !health.supervisor?.running
          ) {
            return 'down';
          }
          const statuses = Object.values(health.components ?? {}).map(
            c => c.status,
          );
          if (statuses.some(s => s === 'stopped')) return 'down';
          if (statuses.some(s => s === 'restarting')) return 'warn';
          return 'ok';
        } catch {
          // Non-JSON output (no health state yet) or exec failure.
          return 'unknown';
        }
      }

      createRoot(document.getElementById('root')).render(<App />);

      // Pinned tray icons (matched on tooltip), the rest behind the ⋯
      // expander — mirrors Windows' own promoted-vs-overflow split. Seeded
      // from the rig's actual promoted set (HKCU NotifyIconSettings,
      // IsPromoted): Viscosity + Elgato Control Center. The M2 config render
      // owns making this a real config knob.
      const PINNED_TRAY = [
        /viscosity/i,
        /elgato|control\s*center/i,
        // Windows Update's icon only exists when something pends — always
        // worth surfacing when it does.
        /windows\s*update|restart.*(required|pending)/i,
      ];

      function App() {
        const [output, setOutput] = useState(providers.outputMap);
        const [health, setHealth] = useState('unknown');
        const [trayExpanded, setTrayExpanded] = useState(false);

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        useEffect(() => {
          let cancelled = false;
          const poll = async () => {
            const status = await readHealth();
            if (!cancelled) setHealth(status);
          };
          poll();
          const timer = setInterval(poll, HEALTH_POLL_MS);
          return () => {
            cancelled = true;
            clearInterval(timer);
          };
        }, []);

        // Get icon to show for current network status.
        function getNetworkIcon(networkOutput) {
          switch (networkOutput.defaultInterface?.type) {
            case 'ethernet':
              return <i className="nf nf-md-ethernet_cable"></i>;
            case 'proprietary_virtual':
              return <i className="nf nf-md-shield_lock_outline"></i>;
            case 'wifi':
              if (networkOutput.defaultGateway?.signalStrength >= 80) {
                return <i className="nf nf-md-wifi_strength_4"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 65
              ) {
                return <i className="nf nf-md-wifi_strength_3"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 40
              ) {
                return <i className="nf nf-md-wifi_strength_2"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 25
              ) {
                return <i className="nf nf-md-wifi_strength_1"></i>;
              } else {
                return <i className="nf nf-md-wifi_strength_outline"></i>;
              }
            default:
              return (
                <i className="nf nf-md-wifi_strength_off_outline"></i>
              );
          }
        }

        // Get icon to show for current weather status.
        function getWeatherIcon(weatherOutput) {
          switch (weatherOutput.status) {
            case 'clear_day':
              return <i className="nf nf-weather-day_sunny"></i>;
            case 'clear_night':
              return <i className="nf nf-weather-night_clear"></i>;
            case 'cloudy_day':
              return <i className="nf nf-weather-day_cloudy"></i>;
            case 'cloudy_night':
              return <i className="nf nf-weather-night_alt_cloudy"></i>;
            case 'light_rain_day':
              return <i className="nf nf-weather-day_sprinkle"></i>;
            case 'light_rain_night':
              return <i className="nf nf-weather-night_alt_sprinkle"></i>;
            case 'heavy_rain_day':
              return <i className="nf nf-weather-day_rain"></i>;
            case 'heavy_rain_night':
              return <i className="nf nf-weather-night_alt_rain"></i>;
            case 'snow_day':
              return <i className="nf nf-weather-day_snow"></i>;
            case 'snow_night':
              return <i className="nf nf-weather-night_alt_snow"></i>;
            case 'thunder_day':
              return <i className="nf nf-weather-day_lightning"></i>;
            case 'thunder_night':
              return <i className="nf nf-weather-night_alt_lightning"></i>;
          }
        }

        return (
          <div className="app">
            <div className="left">
              <span
                className={`health-dot health-${health}`}
                title={`winmakase stack: ${health}`}
              ></span>
              {output.glazewm && (
                <div className="workspaces">
                  {output.glazewm.currentWorkspaces
                    .filter(workspace => workspace.name !== 'scratch')
                    .map(workspace => (
                      <button
                        className={`workspace ${workspace.hasFocus && 'focused'} ${workspace.isDisplayed && 'displayed'}`}
                        onClick={() =>
                          output.glazewm.runCommand(
                            `focus --workspace ${workspace.name}`,
                          )
                        }
                        key={workspace.name}
                      >
                        {workspace.displayName ?? workspace.name}
                      </button>
                    ))}
                </div>
              )}
            </div>

            <div className="center">{output.date?.formatted}</div>

            <div className="right">
              {output.glazewm && (
                <>
                  {output.glazewm.isPaused && (
                    <button
                      className="paused-button"
                      onClick={() =>
                        output.glazewm.runCommand('wm-toggle-pause')
                      }
                    >
                      PAUSED
                    </button>
                  )}
                  {output.glazewm.bindingModes.map(bindingMode => (
                    <button
                      className="binding-mode"
                      key={bindingMode.name}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `wm-disable-binding-mode --name ${bindingMode.name}`,
                        )
                      }
                    >
                      {bindingMode.displayName ?? bindingMode.name}
                    </button>
                  ))}

                  <button
                    className={`tiling-direction nf ${
                      output.glazewm.tilingDirection === 'horizontal'
                        ? 'nf-md-swap_horizontal'
                        : 'nf-md-swap_vertical'
                    }`}
                    onClick={() =>
                      output.glazewm.runCommand('toggle-tiling-direction')
                    }
                  ></button>
                </>
              )}

              {output.network && (
                <div className="network">
                  {getNetworkIcon(output.network)}
                  {output.network.defaultGateway?.ssid}
                </div>
              )}

              {output.memory && (
                <div className="memory">
                  <i className="nf nf-fae-chip"></i>
                  {Math.round(output.memory.usage)}%
                </div>
              )}

              {output.cpu && (
                <div className="cpu">
                  <i className="nf nf-oct-cpu"></i>
                  <span
                    className={output.cpu.usage > 85 ? 'high-usage' : ''}
                  >
                    {Math.round(output.cpu.usage)}%
                  </span>
                </div>
              )}

              {output.weather && (
                <div className="weather">
                  {getWeatherIcon(output.weather)}
                  {Math.round(output.weather.celsiusTemp)}°C
                </div>
              )}

              {output.systray && (
                <div className="systray">
                  {output.systray.icons
                    .filter(icon =>
                      trayExpanded ||
                      PINNED_TRAY.some(p => p.test(icon.tooltip ?? '')),
                    )
                    .map(icon => (
                      <img
                        key={icon.id}
                        className="systray-icon"
                        src={icon.iconUrl}
                        title={icon.tooltip}
                        onClick={e => {
                          e.preventDefault();
                          output.systray.onLeftClick(icon.id);
                        }}
                        onContextMenu={e => {
                          e.preventDefault();
                          output.systray.onRightClick(icon.id);
                        }}
                      />
                    ))}
                  <button
                    className="tray-expander"
                    title={trayExpanded ? 'collapse tray' : 'show all tray icons'}
                    onClick={() => setTrayExpanded(v => !v)}
                  >
                    {trayExpanded ? '›' : '‹'}
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
