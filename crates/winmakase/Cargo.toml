[package]
name = "winmakase"
description = "Winmakase CLI — supervisor, health, logs for the Winmakase desktop stack."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "winmakase"
path = "src/lib.rs"

[[bin]]
name = "winmakase"
path = "src/main.rs"

# The logon-task host: the supervisor as a windowless (GUI-subsystem) process,
# so the scheduled task puts no console on the desktop. See src/bin/winmakased.rs.
[[bin]]
name = "winmakased"
path = "src/bin/winmakased.rs"

# Versions are pinned exactly (repo rule: never "latest"); bump deliberately in
# their own commit, same as the scoop tool pins.
[dependencies]
winmakase-keymap = { path = "../winmakase-keymap" }
clap = { version = "=4.5.51", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.9.8"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tungstenite = "=0.30.0"

[lints.clippy]
all = "deny"
