[package]
name = "winsome"
description = "Winsome CLI — supervisor, health, logs for the Winsome desktop stack."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "winsome"
path = "src/lib.rs"

[[bin]]
name = "winsome"
path = "src/main.rs"

# Versions are pinned exactly (repo rule: never "latest"); bump deliberately in
# their own commit, same as the scoop tool pins.
[dependencies]
winsome-keymap = { path = "../winsome-keymap" }
clap = { version = "=4.5.51", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.9.8"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[lints.clippy]
all = "deny"
