# Generated by `winmakase keymap render --base`; edit the base/keymap sources, not this file.
general:
  keybinding_leader:
    key: caps_lock
    tap_max_ms: 180
workspaces:
- name: '1'

keybindings:
  # window-close — Close window
  - commands: ['close']
    bindings: ['caps_lock+w']
  # window-close-alt — Close window
  - commands: ['close']
    bindings: ['caps_lock+q']
  # layout-toggle-split — Toggle window split
  - commands: ['shell-exec --hide-window winmakase reflow']
    bindings: ['caps_lock+j']
  # window-float — Toggle window floating/tiling
  - commands: ['shell-exec --hide-window winmakase toggle-floating']
    bindings: ['caps_lock+t']
  # window-fullscreen — Full screen
  - commands: ['toggle-fullscreen']
    bindings: ['caps_lock+f']
  # window-fullwidth — Full width
  - commands: ['toggle-fullscreen --maximized']
    bindings: ['caps_lock+alt+f']
  # window-pop — Pop window out (float & pin)
  - commands: ['set-floating --centered --shown-on-top']
    bindings: ['caps_lock+o']
  # focus-left — Focus on left window
  - commands: ['focus --direction left']
    bindings: ['caps_lock+left']
  # focus-right — Focus on right window
  - commands: ['focus --direction right']
    bindings: ['caps_lock+right']
  # focus-up — Focus on above window
  - commands: ['focus --direction up']
    bindings: ['caps_lock+up']
  # focus-down — Focus on below window
  - commands: ['focus --direction down']
    bindings: ['caps_lock+down']
  # workspace-switch-1 — Switch to workspace 1
  - commands: ['focus --workspace 1']
    bindings: ['caps_lock+1']
  # workspace-switch-2 — Switch to workspace 2
  - commands: ['focus --workspace 2']
    bindings: ['caps_lock+2']
  # workspace-switch-3 — Switch to workspace 3
  - commands: ['focus --workspace 3']
    bindings: ['caps_lock+3']
  # workspace-switch-4 — Switch to workspace 4
  - commands: ['focus --workspace 4']
    bindings: ['caps_lock+4']
  # workspace-switch-5 — Switch to workspace 5
  - commands: ['focus --workspace 5']
    bindings: ['caps_lock+5']
  # workspace-switch-6 — Switch to workspace 6
  - commands: ['focus --workspace 6']
    bindings: ['caps_lock+6']
  # workspace-switch-7 — Switch to workspace 7
  - commands: ['focus --workspace 7']
    bindings: ['caps_lock+7']
  # workspace-switch-8 — Switch to workspace 8
  - commands: ['focus --workspace 8']
    bindings: ['caps_lock+8']
  # workspace-switch-9 — Switch to workspace 9
  - commands: ['focus --workspace 9']
    bindings: ['caps_lock+9']
  # workspace-switch-10 — Switch to workspace 10
  - commands: ['focus --workspace 10']
    bindings: ['caps_lock+0']
  # workspace-move-1 — Move window to workspace 1
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['caps_lock+shift+1']
  # workspace-move-2 — Move window to workspace 2
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['caps_lock+shift+2']
  # workspace-move-3 — Move window to workspace 3
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['caps_lock+shift+3']
  # workspace-move-4 — Move window to workspace 4
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['caps_lock+shift+4']
  # workspace-move-5 — Move window to workspace 5
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['caps_lock+shift+5']
  # workspace-move-6 — Move window to workspace 6
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['caps_lock+shift+6']
  # workspace-move-7 — Move window to workspace 7
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['caps_lock+shift+7']
  # workspace-move-8 — Move window to workspace 8
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['caps_lock+shift+8']
  # workspace-move-9 — Move window to workspace 9
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['caps_lock+shift+9']
  # workspace-move-10 — Move window to workspace 10
  - commands: ['move --workspace 10', 'focus --workspace 10']
    bindings: ['caps_lock+shift+0']
  # workspace-move-silent-1 — Move window silently to workspace 1
  - commands: ['move --workspace 1']
    bindings: ['caps_lock+alt+shift+1']
  # workspace-move-silent-2 — Move window silently to workspace 2
  - commands: ['move --workspace 2']
    bindings: ['caps_lock+alt+shift+2']
  # workspace-move-silent-3 — Move window silently to workspace 3
  - commands: ['move --workspace 3']
    bindings: ['caps_lock+alt+shift+3']
  # workspace-move-silent-4 — Move window silently to workspace 4
  - commands: ['move --workspace 4']
    bindings: ['caps_lock+alt+shift+4']
  # workspace-move-silent-5 — Move window silently to workspace 5
  - commands: ['move --workspace 5']
    bindings: ['caps_lock+alt+shift+5']
  # workspace-move-silent-6 — Move window silently to workspace 6
  - commands: ['move --workspace 6']
    bindings: ['caps_lock+alt+shift+6']
  # workspace-move-silent-7 — Move window silently to workspace 7
  - commands: ['move --workspace 7']
    bindings: ['caps_lock+alt+shift+7']
  # workspace-move-silent-8 — Move window silently to workspace 8
  - commands: ['move --workspace 8']
    bindings: ['caps_lock+alt+shift+8']
  # workspace-move-silent-9 — Move window silently to workspace 9
  - commands: ['move --workspace 9']
    bindings: ['caps_lock+alt+shift+9']
  # workspace-move-silent-10 — Move window silently to workspace 10
  - commands: ['move --workspace 10']
    bindings: ['caps_lock+alt+shift+0']
  # scratchpad-toggle — Toggle scratchpad
  - commands: ['shell-exec --hide-window winmakase scratchpad summon']
    bindings: ['caps_lock+s']
  # scratchpad-move — Move window to scratchpad
  - commands: ['move --workspace scratch']
    bindings: ['caps_lock+alt+s']
  # workspace-next — Next workspace
  - commands: ['focus --next-active-workspace']
    bindings: ['caps_lock+tab']
  # workspace-prev — Previous workspace
  - commands: ['focus --prev-active-workspace']
    bindings: ['caps_lock+shift+tab']
  # workspace-former — Former workspace
  - commands: ['focus --recent-workspace']
    bindings: ['caps_lock+ctrl+tab']
  # workspace-to-monitor-left — Move workspace to left monitor
  - commands: ['move-workspace --direction left']
    bindings: ['caps_lock+alt+shift+left']
  # workspace-to-monitor-right — Move workspace to right monitor
  - commands: ['move-workspace --direction right']
    bindings: ['caps_lock+alt+shift+right']
  # workspace-to-monitor-up — Move workspace to up monitor
  - commands: ['move-workspace --direction up']
    bindings: ['caps_lock+alt+shift+up']
  # workspace-to-monitor-down — Move workspace to down monitor
  - commands: ['move-workspace --direction down']
    bindings: ['caps_lock+alt+shift+down']
  # window-swap-left — Swap window to the left
  - commands: ['move --direction left']
    bindings: ['caps_lock+shift+left']
  # window-swap-right — Swap window to the right
  - commands: ['move --direction right']
    bindings: ['caps_lock+shift+right']
  # window-swap-up — Swap window up
  - commands: ['move --direction up']
    bindings: ['caps_lock+shift+up']
  # window-swap-down — Swap window down
  - commands: ['move --direction down']
    bindings: ['caps_lock+shift+down']
  # resize-width-shrink — Shrink window width
  - commands: ['resize --width -2%']
    bindings: ['caps_lock+oem_minus']
  # resize-width-grow — Expand window width
  - commands: ['resize --width +2%']
    bindings: ['caps_lock+oem_plus']
  # resize-height-shrink — Shrink window height
  - commands: ['resize --height -2%']
    bindings: ['caps_lock+shift+oem_minus']
  # resize-height-grow — Expand window height
  - commands: ['resize --height +2%']
    bindings: ['caps_lock+shift+oem_plus']
  # resize-width-shrink-little — Shrink window width a little
  - commands: ['resize --width -1%']
    bindings: ['caps_lock+alt+oem_minus']
  # resize-width-grow-little — Expand window width a little
  - commands: ['resize --width +1%']
    bindings: ['caps_lock+alt+oem_plus']
  # resize-height-shrink-little — Shrink window height a little
  - commands: ['resize --height -1%']
    bindings: ['caps_lock+alt+shift+oem_minus']
  # resize-height-grow-little — Expand window height a little
  - commands: ['resize --height +1%']
    bindings: ['caps_lock+alt+shift+oem_plus']
  # resize-width-shrink-lots — Shrink window width a lot
  - commands: ['resize --width -5%']
    bindings: ['caps_lock+ctrl+oem_minus']
  # resize-width-grow-lots — Expand window width a lot
  - commands: ['resize --width +5%']
    bindings: ['caps_lock+ctrl+oem_plus']
  # resize-height-shrink-lots — Shrink window height a lot
  - commands: ['resize --height -5%']
    bindings: ['caps_lock+ctrl+shift+oem_minus']
  # resize-height-grow-lots — Expand window height a lot
  - commands: ['resize --height +5%']
    bindings: ['caps_lock+ctrl+shift+oem_plus']
  # group-toggle — Toggle window grouping
  - commands: ['shell-exec --hide-window winmakase gap grouping']
    bindings: ['caps_lock+g']
  # app-terminal — Terminal
  - commands: ['shell-exec wt']
    bindings: ['caps_lock+enter']
  # app-browser — Browser
  - commands: ['shell-exec chrome']
    bindings: ['caps_lock+shift+enter']
  # app-browser-alt — Browser
  - commands: ['shell-exec chrome']
    bindings: ['caps_lock+shift+b']
  # app-browser-private — Browser (private)
  - commands: ['shell-exec chrome --incognito']
    bindings: ['caps_lock+alt+shift+b']
  # app-files — File manager
  - commands: ['shell-exec explorer']
    bindings: ['caps_lock+shift+f']
  # app-editor — Editor
  - commands: ['shell-exec code']
    bindings: ['caps_lock+shift+n']
  # launcher — Open or focus PowerToys Run
  - commands: ['shell-exec --hide-window winmakase-run']
    bindings: ['caps_lock+space']
  # wm-cycle-focus — Cycle focus across tiling/floating/fullscreen layers
  - commands: ['wm-cycle-focus']
    bindings: ['caps_lock+escape']
  # calculator — Calculator
  - commands: ['shell-exec calc']
    bindings: ['caps_lock+ctrl+q']
  # activity — Activity monitor
  - commands: ['shell-exec taskmgr']
    bindings: ['caps_lock+ctrl+t']
